<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wonderfold — Fold. Punch. Unfold.</title>
    <meta
      name="description"
      content="A paper-folding puzzle for your spatial brain. Watch the sheet fold, see it punched, and pick what it looks like unfolded. Free, no sign-up."
    />
    <meta name="theme-color" content="#F3EEE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wonderfold — Fold. Punch. Unfold." />
    <meta property="og:description" content="A paper-folding puzzle for your spatial brain. New daily challenge every day." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('wonderfold:v1') || '{}').settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Wonderfold needs JavaScript to fold paper.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
